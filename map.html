<!DOCTYPE html>
<html lang="ja">
<head>

  <style>

    body {
      font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .pin {
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .pin:hover {
      transform: scale(1.25) translateY(-4px);
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25));
    }
    .pin-active {
      transform: scale(1.3) translateY(-6px);
      filter: drop-shadow(0 8px 16px rgba(2, 132, 199, 0.45));
    }
    .route-line {
      stroke-dasharray: 6 6;
      animation: dash 30s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }

    function selectSpot(id) {
      const data = spots[id];
      if (!data) return;

      document.getElementById('card-icon').textContent = data.icon;
      document.getElementById('card-tag').textContent = data.tag;
      document.getElementById('card-tag').className = 'text-[10px] font-bold px-2 py-0.5 rounded-full ' + data.tagBg;
      document.getElementById('card-time').textContent = data.time;
      document.getElementById('card-title').textContent = data.title;
      document.getElementById('card-desc').textContent = data.desc;
      document.getElementById('card-tip-text').textContent = data.tip;
      document.getElementById('card-gmap').href = data.gmap;

      // ピンのハイライト
      document.querySelectorAll('.pin').forEach(p => p.classList.remove('pin-active'));
      const activePin = document.getElementById('pin-' + id);
      if (activePin) activePin.classList.add('pin-active');
    }

    function setFilter(day) {
      // ボタンのアクティブ化
      ['all', 'day1', 'day2', 'day3'].forEach(d => {
        const btn = document.getElementById('btn-' + d);
        if (d === day) {
          btn.className = 'px-3 py-1.5 rounded-xl bg-sky-600 text-white shadow-xs font-bold';
        } else {
          btn.className = 'px-3 py-1.5 rounded-xl bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 font-bold';
        }
      });

      // ルート線の切り替え
      document.getElementById('route-day1').style.opacity = (day === 'all' || day === 'day1') ? '1' : '0.08';
      document.getElementById('route-day2').style.opacity = (day === 'all' || day === 'day2') ? '1' : '0.08';
      document.getElementById('route-day3').style.opacity = (day === 'all' || day === 'day3') ? '1' : '0.08';

      // 該当日の最初のスポットを選択
      if (day === 'day1') selectSpot('hirao');
      else if (day === 'day2') selectSpot('museum');
      else if (day === 'day3') selectSpot('anpanman');
      else selectSpot('hotel');
    }
  </script>
